<div class="demo-sort-controls">
  <label>Sort by <select aria-label="Sort products" (change)="sortChanged.emit($any($event.target).value ? +$any($event.target).value : null)">
    <option value="">Default Sorting</option><option *ngFor="let option of sortList" [value]="option.value">{{ option.text }}</option>
  </select></label>
  <div role="group" aria-label="Product layout">
    <button type="button" aria-label="Grid view" [attr.aria-pressed]="grid" (click)="switch(1)"><img alt="" src="./assets/svg/grid.svg" /></button>
    <button type="button" aria-label="List view" [attr.aria-pressed]="list" (click)="switch(2)"><img alt="" src="./assets/svg/list.svg" /></button>
  </div>
</div>
