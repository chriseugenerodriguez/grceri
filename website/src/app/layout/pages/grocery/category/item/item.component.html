<a [routerLink]="['/grocery/', product(cat), product(name)]">
  <img loading="lazy" [src]="images?.[0] || '/assets/svg/cart.svg'" (error)="imageError($event)" [alt]="name" />
</a>
<div class="meta">
  <a [routerLink]="['/grocery/', product(cat), product(name)]">

    <h4>{{name}}</h4>
    <p *ngIf="desc">{{ desc }}</p>

    <div class="rating">
      <ng-container *ngIf="rating">
        <bar-rating [(rate)]="rating" [max]="5" readOnly="true" theme="fontawesome-o"></bar-rating>
        {{rating}}
      </ng-container>
    </div>

    <div class="price">
      ${{price}}
    </div>
  </a>
</div>
