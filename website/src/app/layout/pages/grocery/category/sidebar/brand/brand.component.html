<input #searchTextbox type="search" aria-label="Search brands" class="demo-brand-search" [formControl]="brandSearchControl" placeholder="Search brands" />
<ol class="brands-list" [class.overflow]="availableFilters.length > 12">
  <li *ngFor="let brand of (brandSearchControl.value ? searchFilters : availableFilters)">
    <label><input type="checkbox" name="brand-filter" [checked]="filterActive(brand)" (change)="changeFilterStatus($event, brand)"><span>{{ brand.name }} <span class="count">({{ brand.num }})</span></span></label>
  </li>
</ol><p *ngIf="brandSearchControl.value && !searchFilters.length">No matching brands</p>
