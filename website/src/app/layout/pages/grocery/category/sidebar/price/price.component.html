<form [formGroup]="priceForm" (ngSubmit)="onSubmit()" class="range form-group">
  <input min="0" step="0.01" type="number" formControlName="from" placeholder="min" aria-label="Minimum price" />
  <span>to</span>
  <input min="0" step="0.01" type="number" formControlName="to" placeholder="max" aria-label="Maximum price" />
  <button type="submit" class="btn" [disabled]="!submit" aria-label="Apply price range">Apply price range</button>
</form>
<p *ngIf="invalidRange" role="alert">Use nonnegative prices with the minimum no greater than the maximum.</p>
<button type="button" class="btn" (click)="clear()" *ngIf="activatedFilters.length">Clear price filter</button>
<ol class="price-list">
  <li *ngFor="let price of dispFilters">
    <label>
      <input type="checkbox" name="price-filter" [checked]="filterActive(price)" (change)="changeFilterStatus($event, price)">
      <span>${{ price.from }} - {{ price.to !== null ? '$' + price.to : 'and Up' }} <span class="count">({{ price.num }})</span></span>
    </label>
  </li>
</ol>
