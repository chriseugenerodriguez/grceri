<form class="demo-search" role="search" (ngSubmit)="search()">
    <label><span class="sr-only">Search groceries</span>
      <input name="query" [(ngModel)]="query" maxlength="100" placeholder="Search groceries" type="search">
    </label>
    <button type="submit" aria-label="Search groceries"><i class="fa fa-search" aria-hidden="true"></i></button>
</form>
