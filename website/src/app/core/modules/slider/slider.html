<section aria-label="Product carousel">
<div class="demo-slider-controls" *ngIf="showControls"><button type="button" aria-label="Previous products" (click)="prev()"><i class="fa fa-angle-left" aria-hidden="true"></i></button><button type="button" aria-label="Next products" (click)="next()"><i class="fa fa-angle-right" aria-hidden="true"></i></button></div>
<ul #track class="demo-slider-track" tabindex="0" aria-label="Scrollable products"><li *ngFor="let item of items"><ng-container [ngTemplateOutlet]="item.tpl"></ng-container></li></ul>
</section>
